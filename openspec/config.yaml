schema: spec-driven

context: |
  Tech stack: Next.js 14+ (React, App Router, TypeScript, Tailwind CSS, shadcn/ui), FastAPI (Python 3.12+, Pydantic, SQLAlchemy 2.0, Alembic), PostgreSQL 16, Celery + Redis, Docker Compose v2, Nginx, Jenkins CI/CD.
  Architecture: Monorepo (frontend/, backend/, nginx/), Clean/Hexagonal Architecture.
  Integrations: Gentle AI environment, Engram skills, Multi-agent orchestrator, CodeGraph, Context7.
  Testing: Backend tests exist in backend/tests (pytest + FastAPI TestClient) but pytest is not declared in pyproject.toml; frontend has no test runner configured.

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected modules/packages
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
  apply:
    - Follow existing code patterns and conventions
    - Load relevant coding skills for the project stack
    tdd: false
    test_command: ""
  verify:
    - Run tests if test infrastructure exists
    - Compare implementation against every spec scenario
    test_command: ""
    build_command: "docker compose -f docker-compose.yml build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas (large removals)

# SDD testing capabilities cache — generated by sdd-init phase
# Detected backend test runner: pytest (via backend/tests/test_api.py)
# Backend test command (requires pytest installed in backend container): docker compose exec backend pytest
# Frontend test runner: none
# Frontend lint/type command: npm run lint (Next.js ESLint); npx tsc --noEmit (TypeScript)
