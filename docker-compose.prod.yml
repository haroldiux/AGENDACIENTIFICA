services:
  db:
    image: postgres:16-alpine
    container_name: agenda-db
    restart: unless-stopped
    command: postgres -c shared_buffers=64MB -c max_connections=30 -c work_mem=4MB
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agenda_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agenda_secure_2026}
      POSTGRES_DB: ${POSTGRES_DB:-agenda}
    volumes:
      - agenda_postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - agenda-internal

  redis:
    image: redis:7-alpine
    container_name: agenda-redis
    restart: unless-stopped
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru --save ""
    deploy:
      resources:
        limits:
          memory: 64M
    networks:
      - agenda-internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agenda-backend
    restart: unless-stopped
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1"
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-agenda_user}:${POSTGRES_PASSWORD:-agenda_secure_2026}@db:5432/${POSTGRES_DB:-agenda}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-agenda_unitepc_supersecret_production_key_2026}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - WHATSAPP_API_TOKEN=${WHATSAPP_API_TOKEN:-}
      - WHATSAPP_PHONE_ID=${WHATSAPP_PHONE_ID:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
    volumes:
      - agenda_uploads:/app/uploads
    depends_on:
      - db
      - redis
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - agenda-internal

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agenda-worker
    restart: unless-stopped
    command: celery -A app.core.celery_app.celery_app worker -B --loglevel=info --concurrency=1
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-agenda_user}:${POSTGRES_PASSWORD:-agenda_secure_2026}@db:5432/${POSTGRES_DB:-agenda}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-agenda_unitepc_supersecret_production_key_2026}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - WHATSAPP_API_TOKEN=${WHATSAPP_API_TOKEN:-}
      - WHATSAPP_PHONE_ID=${WHATSAPP_PHONE_ID:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
    volumes:
      - agenda_uploads:/app/uploads
    depends_on:
      - db
      - redis
    deploy:
      resources:
        limits:
          memory: 192M
    networks:
      - agenda-internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=https://agenda.unitepc.pro/api/v1
    container_name: agenda-frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=https://agenda.unitepc.pro/api/v1
      - NODE_ENV=production
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - agenda-internal

  nginx:
    image: nginx:alpine
    container_name: agenda-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          memory: 32M
    networks:
      - agenda-internal
      - proxy

volumes:
  agenda_postgres_data:
  agenda_uploads:

networks:
  agenda-internal:
    driver: bridge
  proxy:
    external: true
    name: ${PROXY_NETWORK:-red-proxy}
