[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for Sistema Agenda UNITEPC"
authors = [
    {name = "Dev", email = "dev@example.com"}
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.1",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.4",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "celery>=5.4.0",
    "redis>=5.0.6",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "weasyprint>=62.3",
    "jinja2>=3.1.4",
    "pytest>=8.2.0",          # test runner for backend verification
    "httpx>=0.27.0",          # required by FastAPI TestClient for test-infrastructure repair
]
readme = "README.md"
requires-python = ">= 3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

